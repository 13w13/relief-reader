version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Libraries of the app (audit S1, 9.6): one weekly batch, reviewed like any change.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle:
        patterns: ["*"]
    # Major versions change the build or the API (AGP 9 builds Kotlin in and refuses the
    # kotlin-android plugin; Gradle 9; OkHttp 5; a new Compose BOM year). They are done on
    # purpose, one at a time, not by the weekly batch.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
