name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # release.yml only runs on a tag, so an error there would only show at the next release:
  # actionlint checks the syntax and the expressions of every workflow on each push (security
  # audit of 15/11). Its archive is checked against its SHA-256; shell scripts are not linted.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      # actionlint_<version>_linux_amd64.tar.gz of rhysd/actionlint; change both lines together.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the workflows with actionlint
        run: |
          set -eu
          TGZ="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$TGZ" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $TGZ" | sha256sum -c -
          tar -xzf "$TGZ" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=

      # release.yml checks the signing certificate with apksigner from the runner's Android SDK,
      # without installing anything: this step proves the runner has it.
      - name: Check that the runner has apksigner
        run: |
          set -eu
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          TOOLS=$( (ls -d "$SDK"/build-tools/* 2>/dev/null || true) | sort -V | tail -n 1)
          if [ -z "$TOOLS" ] || [ ! -x "$TOOLS/apksigner" ]; then
            echo "::error::apksigner not found under $SDK/build-tools."
            exit 1
          fi
          echo "$TOOLS/apksigner $("$TOOLS/apksigner" --version)"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test the API module
        run: ./gradlew --no-daemon :api:test

      # No appname here (securite-open-source.md, section 9): the debug APK below is uploaded on
      # every run, pull requests included, and must not carry it. The tests do not need it; only
      # e2e.yml (which uploads no APK) and release.yml use the secret.
      - name: Build the app and run its tests
        if: hashFiles('app/build.gradle.kts') != ''
        # recordRoborazziDebug runs the unit tests and writes the screenshots.
        run: ./gradlew --no-daemon :app:recordRoborazziDebug :app:assembleDebug

      - name: Upload the Room schemas
        if: always() && hashFiles('app/schemas/**') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: room-schemas
          path: app/schemas/
          retention-days: 14

      # Runs even when the tests fail, and prints the schema in full: with the artifact storage
      # quota hit (12/11), the log is where a new schema can be read and committed.
      - name: Check that the Room schemas are committed
        if: always() && hashFiles('app/schemas/**') != ''
        run: |
          git add -N app/schemas
          if ! git diff --exit-code --stat -- app/schemas; then
            git --no-pager diff -- app/schemas
            echo "::error::The Room schema differs from app/schemas. Commit the files of the room-schemas artifact, or the diff above."
            exit 1
          fi

      - name: Upload the debug APK
        if: hashFiles('app/build/outputs/apk/debug/*.apk') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          # 19 MB a run: kept 3 days (artifact storage quota hit on 12/11).
          retention-days: 3

      - name: Upload screenshots
        if: always() && hashFiles('app/build/outputs/roborazzi/**') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
          retention-days: 7

      - name: Upload test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

      # The release build with R8, signed with the debug key (build type "minified"), after the
      # debug uploads above: a failure of R8 does not cost the screenshots and the debug APK.
      # A code R8 removed by mistake shows here, or on a phone with the APK uploaded below.
      - name: Build the release with R8
        if: hashFiles('app/build.gradle.kts') != ''
        run: |
          ./gradlew --no-daemon :app:assembleMinified
          ls -l app/build/outputs/apk/minified/*.apk app/build/outputs/mapping/minified/mapping.txt

      # Its mapping.txt turns a stack trace of this APK back into readable names (retrace).
      - name: Upload the minified APK and its mapping
        if: always() && hashFiles('app/build/outputs/apk/minified/*.apk') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rel-minified-apk
          path: |
            app/build/outputs/apk/minified/*.apk
            app/build/outputs/mapping/minified/mapping.txt
          retention-days: 3

      # WorkManager finds scheduled work by the worker's class name: a worker renamed by R8 would
      # not run after an update from 0.6.x, built without R8. The minified build cannot try that
      # update (another application id and key): this check on the mapping covers it.
      - name: Check that R8 kept the names of the workers and exceptions
        if: hashFiles('app/build.gradle.kts') != ''
        run: |
          set -eu
          MAPPING=app/build/outputs/mapping/minified/mapping.txt
          for c in io.relais.app.work.SyncWorker io.relais.app.work.DigestWorker io.relais.app.work.PreloadWorker 'io.relais.api.ApiException$Network'; do
            if ! grep -qF "$c -> $c:" "$MAPPING"; then
              echo "::error::R8 renamed $c (or removed it): $(grep -F "$c ->" "$MAPPING" || echo 'not in the mapping')"
              exit 1
            fi
            echo "kept: $c"
          done

      # The minified build is a test build: no appname, and no daily request to GitHub.
      - name: Check the minified build's settings
        if: hashFiles('app/build.gradle.kts') != ''
        run: |
          set -eu
          CONFIG=app/build/generated/source/buildConfig/minified/io/relais/app/BuildConfig.java
          grep -n 'RELIEFWEB_APPNAME\|UPDATE_CHECK' "$CONFIG"
          grep -q 'String RELIEFWEB_APPNAME = "";' "$CONFIG" || { echo "::error::The minified build carries an appname."; exit 1; }
          grep -q 'boolean UPDATE_CHECK = false;' "$CONFIG" || { echo "::error::The minified build checks for new versions."; exit 1; }

      # pdfbox-android logs through android.util.Log; were commons-logging on the classpath, R8
      # would need a rule for it (proguard-rules.pro).
      - name: Check that commons-logging is not in the release
        if: hashFiles('app/build.gradle.kts') != ''
        run: |
          if ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath | grep -i 'commons-logging'; then
            echo "::error::commons-logging is in the release classpath: add a keep rule for org.apache.commons.logging."
            exit 1
          fi
          echo "commons-logging: not in the release classpath."

      # The permissions of the APK, as Android reads them, must be the ones the README lists (its
      # comment "permissions:" under "Android permissions, all of them").
      - name: Check the APK's permissions against the README
        if: hashFiles('app/build.gradle.kts') != ''
        run: |
          set -eu
          APK=$(ls app/build/outputs/apk/minified/*.apk | head -n 1)
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          TOOLS=$( (ls -d "$SDK"/build-tools/* 2>/dev/null || true) | sort -V | tail -n 1)
          DUMP=$("$TOOLS/aapt2" dump permissions "$APK")
          echo "$DUMP"
          PACKAGE=$(echo "$DUMP" | sed -n "s/^package: *//p" | head -n 1)
          ACTUAL=$(echo "$DUMP" | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" | sort -u)
          EXPECTED=$(sed -n 's/^<!-- permissions: \(.*\) -->$/\1/p' README.md | tr ' ' '\n' | sed "s/\${applicationId}/$PACKAGE/" | sed '/^$/d' | sort -u)
          if [ -z "$EXPECTED" ]; then
            echo "::error::No '<!-- permissions: ... -->' line in README.md."
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::The APK's permissions differ from the README's list."
            diff <(echo "$EXPECTED") <(echo "$ACTUAL") || true
            exit 1
          fi
          echo "The APK asks for exactly the permissions the README lists."
