name: Release

# Shown in the Actions list, so that the run waiting for the founder's approval is easy to find.
run-name: "TO APPROVE: publish Re.L ${{ github.ref_name }}"

# Builds the release APK signed with the founder's key (RELEASE_* secrets), then publishes it as
# a GitHub Release with its checksum and a provenance attestation. Without the key the build
# fails: the debug key is public, an APK signed with it is not a release.
#
# Security audit of 15/11:
# - tags vX.Y.Z only, no manual run: a manual run could sign any branch;
# - the tagged commit must be on main, and the tag must match versionName;
# - two jobs: "build" holds the signing secrets with read-only access to the repository, and
#   "publish" holds the write token and runs no Gradle;
# - no shared Gradle cache in the signed build;
# - the build job uses the "release" environment, so that the founder can move the secrets
#   there and protect them.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    steps:
      # The whole history, to check that the tagged commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag against main and versionName
        run: |
          set -eu
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts."
            exit 1
          fi
          if ! git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null; then
            echo "::error::origin/main is missing from the checkout."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::The tagged commit $(git rev-parse HEAD) is not on main."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME, versionName $VERSION, commit $(git rev-parse --short HEAD) on main."

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # No cache shared with other workflows: the signed build starts from nothing.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Decode the release key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::A RELEASE_* secret is missing: no release without the founder's key."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "Release key found."

      # Since v0.3.1 the release APK carries no appname: each reader brings their own, entered
      # in the app ("Connect to ReliefWeb"). Debug builds for the journeys still get one.
      - name: Build the release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-build-cache :app:assembleRelease

      - name: Delete the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Name the APK and its checksum
        run: |
          set -eu
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/rel-$VERSION.apk"
          (cd dist && sha256sum "rel-$VERSION.apk" > "rel-$VERSION.apk.sha256")
          ls -l dist

      # Handed to the publish job; a release asset does not count against the artifact quota,
      # this artifact lives one day.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rel-release-apk
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # For release-notes/<tag>.md only: no Gradle in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rel-release-apk
          path: dist

      # Exactly one APK, intact, and signed with the certificate published in the README (review
      # of PR 25). apksigner comes from the runner's Android SDK: nothing is installed.
      - name: Check the APK, its checksum and its signing certificate
        run: |
          set -eu
          ls -l dist
          APKS=$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)
          if [ "$APKS" -ne 1 ]; then
            echo "::error::Expected exactly one APK in dist, found $APKS."
            exit 1
          fi
          APK=$(find dist -maxdepth 1 -type f -name '*.apk')
          (cd dist && sha256sum -c ./*.apk.sha256)
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          TOOLS=$( (ls -d "$SDK"/build-tools/* 2>/dev/null || true) | sort -V | tail -n 1)
          if [ -z "$TOOLS" ] || [ ! -x "$TOOLS/apksigner" ]; then
            echo "::error::apksigner not found under $SDK/build-tools."
            exit 1
          fi
          EXPECTED=$( (grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}' README.md || true) | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$EXPECTED" ]; then
            echo "::error::No certificate fingerprint in README.md."
            exit 1
          fi
          OUT=$("$TOOLS/apksigner" verify --print-certs "$APK")
          echo "$OUT"
          FOUND=$( (echo "$OUT" | grep -E 'certificate SHA-256 digest:' || true) | sed -E 's/.*digest: *//' | tr -d ': ' | tr 'A-F' 'a-f' | sort -u)
          if [ "$FOUND" != "$EXPECTED" ]; then
            echo "::error::The APK is signed with '$FOUND', not the certificate published in the README ($EXPECTED)."
            exit 1
          fi
          echo "Signed with the certificate published in the README."

      # Provenance: who built the APK, from which commit and workflow. Readers can check it with
      # `gh attestation verify rel-X.Y.Z.apk --repo 13w13/relief-reader` (README).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.apk

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Notes come from release-notes/<tag>.md when the file exists.
          NOTES="release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then
            set -- --notes-file "$NOTES"
          else
            set -- --notes "Re.L, an unofficial ReliefWeb reader. Signed APK, install on Android 8.0 or later."
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Re.L $GITHUB_REF_NAME" "$@"
