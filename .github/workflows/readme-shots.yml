name: README screenshots
# The screenshots of the README and of the F-Droid listing, never drawn on real reports:
# - ReadmeScreensTest: Today, Following and a PDF read as text, light and dark (screen-*.png), on
#   its own made-up data. docs/readme/screens-light.webp and screens-dark.webp assemble them with
#   the art director's readme_triptyque.py; the light ones are the F-Droid phoneScreenshots.
# - ReadmeScreenshotTest: Connect, About and other states, on made-up fixtures (make_fixtures.py).
# The artifact storage quota was hit on 12/11: the images are also printed in base64 in the
# log, between BEGIN and END lines, to be decoded with `base64 -d`.
# A push to the branch readme-shots runs it too: a manual run needs the file on main first.
on:
  workflow_dispatch:
  push:
    branches: [readme-shots]

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Replace the fixtures with made-up ones
        run: python3 tools/make_fixtures.py
      - name: Draw the screenshots
        run: ./gradlew --no-daemon :app:testDebugUnitTest -Proborazzi.test.record=true --tests 'io.relais.app.ReadmeScreenshotTest' --tests 'io.relais.app.ReadmeScreensTest'
      - name: Print the screenshots
        run: |
          for f in app/build/outputs/roborazzi/readme/*.png; do
            echo "BEGIN $(basename "$f") $(sha256sum "$f" | cut -d' ' -f1)"
            base64 -w 76 "$f"
            echo "END $(basename "$f")"
          done
      - name: Upload the screenshots
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme-screenshots
          path: app/build/outputs/roborazzi/readme/
          retention-days: 7
