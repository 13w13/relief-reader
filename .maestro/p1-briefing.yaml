# Journey 1, the morning briefing, in direct mode:
# real ReliefWeb API, so titles and counts change every day. The flow checks stable UI
# texts and uses test tags (tab_*, doc_<id>, save_button) instead of daily titles.
appId: org.relreader.app
name: p1-briefing
tags:
  - journey
  - direct
onFlowStart:
  - setAirplaneMode: disabled
onFlowComplete:
  - setAirplaneMode: disabled
---
# Fresh install. Notifications are left unset so that Android asks for them at step 1.4.
- launchApp:
    appId: org.relreader.app
    clearState: true
    permissions:
      notifications: unset
- startRecording: p1-briefing

# 1.1 to 1.4: welcome, Lebanon and Sudan, "Turn on" then "Allow".
- runFlow:
    file: common/onboarding.yaml
    env:
      PREFIX: p1
      DIGEST: allow

# 1.5 Today after the first sync. Since v0.4 the headlines are a pile of cards: the card on
# screen carries headline_(un)read_<id>, and the counter under it gives its place ("1 of 6").
# A fresh install has read nothing: the pile opens on the first card.
- extendedWaitUntil:
    visible:
      id: "(doc|headline_unread|headline_read)_.*"
    timeout: 90000
- assertVisible: "Headlines"
- assertVisible:
    id: "pile_position"
    text: "1 of \\d+"
- takeScreenshot: p1-06-today

# 1.5a Leaf through the pile: the arrow, then a swipe across the card, then back to 1. The
# swipe starts away from the edges, where Android has its back gesture. A quiet week may have
# a single headline: the arrow then leads to the end card.
- tapOn:
    id: "pile_next"
- extendedWaitUntil:
    visible:
      id: "pile_position"
      text: "(2 of \\d+|End)"
    timeout: 10000
- takeScreenshot: p1-07-pile-next
- tapOn:
    id: "pile_previous"
- extendedWaitUntil:
    visible:
      id: "pile_position"
      text: "1 of \\d+"
    timeout: 10000
- swipe:
    from:
      id: "headline_unread_.*"
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: "pile_position"
      text: "(2 of \\d+|End)"
    timeout: 10000
- tapOn:
    id: "pile_previous"
- extendedWaitUntil:
    visible:
      id: "pile_position"
      text: "1 of \\d+"
    timeout: 10000

# 1.5b Pull to refresh (v0.1.2): the pile comes back on the same card.
- swipe:
    start: 50%, 40%
    end: 50%, 85%
- extendedWaitUntil:
    visible:
      id: "(doc|headline_unread|headline_read)_.*"
    timeout: 60000
- assertVisible:
    id: "pile_position"
    text: "1 of \\d+"
- takeScreenshot: p1-07b-pulled

# 1.6 Open the headline on screen (tagged headline_unread_<id>).
- tapOn:
    id: "headline_unread_.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "save_button"
    timeout: 30000
# One line of dates since v0.2.2 (theme-compose.md 12.7): "Published 5 November 2026", with
# the posting date only when it came more than two days later.
- assertVisible: "(Published|Posted on ReliefWeb) .*"
- takeScreenshot: p1-08-report

# 1.7 After the text, before Details: "Headline 1 of 6", Next and "Previous headline" (v0.4).
- scrollUntilVisible:
    element:
      id: "headline_nav"
    direction: DOWN
    timeout: 120000
    speed: 60
- scrollUntilVisible:
    element:
      id: "headline_previous"
    direction: DOWN
    timeout: 10000
- assertVisible: "HEADLINE 1 OF \\d+"
- takeScreenshot: p1-09-headline-nav
- scrollUntilVisible:
    element:
      text: "Details"
    direction: DOWN
    timeout: 30000
- takeScreenshot: p1-09b-report-details
- scrollUntilVisible:
    element:
      text: "Open on ReliefWeb"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Read the original on .*"
    direction: DOWN
    timeout: 5000
    optional: true
- takeScreenshot: p1-10-report-links

# 1.7b Next replaces the report with the second headline, without stacking: Back then returns
# to Today, on the card of that second headline. With a single headline this week, Next leads
# to the older headlines instead: the step is skipped.
- scrollUntilVisible:
    element:
      id: "headline_next"
    direction: UP
    timeout: 60000
- runFlow:
    when:
      notVisible: "HEADLINE 1 OF 1"
    commands:
      - tapOn:
          id: "headline_next"
      - extendedWaitUntil:
          visible:
            id: "save_button"
          timeout: 30000
      - scrollUntilVisible:
          element:
            text: "HEADLINE 2 OF \\d+"
          direction: DOWN
          timeout: 120000
          speed: 60
      - takeScreenshot: p1-10b-second-headline

# 1.8 Back to Today, on the card of the last headline read.
- back
- extendedWaitUntil:
    visible:
      id: "tab_today"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "pile_position"
      text: "(1 of 1|2 of \\d+)"
    timeout: 15000
- takeScreenshot: p1-11-back-on-card

# 1.8b Most read on ReliefWeb: "See all" under the block of Today opens every line of the
# file, grouped. The block is there only when the phone has the file (once a day, Wi-Fi).
# "Most reports this week" stays under it (the founder, 14/11).
- scrollUntilVisible:
    element:
      text: "Most read on ReliefWeb"
    direction: DOWN
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: "most_read_all"
    commands:
      - tapOn:
          id: "most_read_all"
      - extendedWaitUntil:
          visible:
            id: "page_most_read"
          timeout: 30000
      # The bottom bar keeps Today lit on a page opened from it (v0.4).
      - assertVisible:
          id: "tab_today"
          selected: true
      - extendedWaitUntil:
          visible: "(What ReliefWeb visitors read most in the last 4 weeks.*|ReliefWeb's most-read list isn't available right now\\.)"
          timeout: 60000
      # The phone's documents show at once; the others arrive by batches of 50.
      - extendedWaitUntil:
          notVisible: "Loading the documents that are not on your phone yet\\."
          timeout: 90000
      - takeScreenshot: p1-11b-most-read
      - back
- scrollUntilVisible:
    element:
      text: "Most reports this week"
    direction: DOWN
    timeout: 20000
    optional: true
- scrollUntilVisible:
    element:
      id: "pile_next"
    direction: UP
    timeout: 30000

# 1.9 Mark as read from the menu of a card: a long press. The next unread card, if any.
- repeat:
    while:
      notVisible:
        id: "headline_unread_.*"
    times: 20
    commands:
      - runFlow:
          when:
            visible:
              id: "pile_position"
              text: "End"
          commands:
            - tapOn:
                id: "pile_previous"
      - runFlow:
          when:
            notVisible:
              id: "pile_position"
              text: "End"
          commands:
            - tapOn:
                id: "pile_next"
- runFlow:
    when:
      visible:
        id: "headline_unread_.*"
    commands:
      - longPressOn:
          id: "headline_unread_.*"
          index: 0
      - tapOn: "Mark as read"
      - extendedWaitUntil:
          visible:
            id: "headline_read_.*"
          timeout: 15000
      - takeScreenshot: p1-12-marked-read

# 1.10 A country page opened from Today: the bottom bar keeps Today lit (v0.4). Since v0.2.2
# the page opens on All, one list under the row of filters; documents posted since the last
# visit carry the dot described as "New".
- openLink: relais://country/220
- extendedWaitUntil:
    visible:
      id: "doc_.*"
    timeout: 60000
- assertVisible: "Humanitarian situation"
- assertVisible:
    id: "page_all"
- assertVisible: "New"
- assertVisible:
    id: "tab_today"
    selected: true
- takeScreenshot: p1-15-country-sudan
- runFlow:
    file: common/filter.yaml
    env:
      FILTER: "sitreps"
- extendedWaitUntil:
    visible:
      id: "doc_.*"
    timeout: 60000
- takeScreenshot: p1-15b-country-sudan-sitreps
- back

# 1.12 Every headline read: from the end card, open and close each line left (tagged
# pile_line_unread_<id>). Back stands on that headline's card; the arrow leads back to the end.
- extendedWaitUntil:
    visible:
      id: "tab_today"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "pile_next"
    direction: UP
    timeout: 30000
- repeat:
    while:
      notVisible:
        id: "pile_position"
        text: "End"
    times: 25
    commands:
      - tapOn:
          id: "pile_next"
- takeScreenshot: p1-13-pile-end
- repeat:
    while:
      visible:
        id: "pile_line_unread_.*"
    times: 25
    commands:
      - tapOn:
          id: "pile_line_unread_.*"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "save_button"
          timeout: 30000
      - back
      - extendedWaitUntil:
          visible:
            id: "pile_next"
          timeout: 15000
      - repeat:
          while:
            notVisible:
              id: "pile_position"
              text: "End"
          times: 25
          commands:
            - tapOn:
                id: "pile_next"
- assertVisible: "You're up to date"
- assertVisible:
    id: "pile_older"
- takeScreenshot: p1-16-up-to-date

# 1.12b "Older headlines": with an appname, the search of headlines by date.
- tapOn:
    id: "pile_older"
- extendedWaitUntil:
    visible:
      id: "doc_.*"
    timeout: 60000
- takeScreenshot: p1-16b-older-headlines
- back

# 1.13 Offline. Within 30 minutes of a sync, Today does not call the network on launch,
# so the banner shows once Refresh tries and fails.
- setAirplaneMode: enabled
- launchApp:
    appId: org.relreader.app
- extendedWaitUntil:
    visible:
      id: "tab_today"
    timeout: 30000
- tapOn: "Refresh"
# v0.3 (theme-compose.md 13.3): one discreet line, "Offline · saved at 08:02".
- extendedWaitUntil:
    visible: "(Offline · saved at .*|Offline\\. Showing what was saved at .*)"
    timeout: 30000
- takeScreenshot: p1-17-offline

# 1.14 A Sudan report from the sync opens offline, with its text: the country page lists the
# phone's documents.
- openLink: relais://country/220
- extendedWaitUntil:
    visible:
      id: "doc_.*"
    timeout: 15000
- tapOn:
    id: "doc_.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "save_button"
    timeout: 15000
- assertNotVisible: "This report isn't saved on your phone. Connect to load it."
- takeScreenshot: p1-18-offline-report
- back
- back

# 1.15 Back online, the daily summary on command (debug build: relaisdebug://digest), then
# the notification in the shade. The summary counts the last 24 hours: Sudan always has
# reports in that window.
# Not checked: the multi-country text ("Sudan 3, Lebanon 4", ecrans.md M13) has no string in
# strings.xml yet (Work.kt builds it by hand); the fixed counts belong to the fixtures mode.
# The notification first shows as a status bar icon ("Re.L notification: Daily summary");
# the shade is opened only then, and again if the first swipe did not open it.
- setAirplaneMode: disabled
- openLink: relaisdebug://digest
- extendedWaitUntil:
    visible: ".*notification: Daily summary"
    timeout: 90000
# The status bar icon above already names the notification ("Daily summary"). The shade is
# opened for the screenshot; on the CI emulator the swipe sometimes leaves it closed.
- repeat:
    while:
      notVisible: "Daily summary"
    times: 4
    commands:
      - swipe:
          start: 50%, 1%
          end: 50%, 85%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 3000
- takeScreenshot: p1-19-daily-summary
- runFlow:
    when:
      visible: "Daily summary"
    commands:
      - back

- stopRecording
