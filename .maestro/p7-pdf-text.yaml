# Journey 7, read a PDF as text, search, highlight (produit/passe-v0.2.md 7.3), with step 8.4
# (copy a passage of a PDF with its citation). Generated test PDFs only (test-sitrep.pdf and
# test-scan.pdf, tools/make_test_pdfs.py), put on the phone by the debug build's
# relaispdf://sample/<name>: nothing is downloaded from ReliefWeb, whose bot check blocks
# GitHub's machines. One change from the written journey: "Read" opens the Text view first
# (theme-compose.md 5.11), so 7.1 and 7.2 check the Text view, then the switch.
appId: org.relreader.app
name: p7-pdf-text
tags:
  - journey
  - pdf
onFlowStart:
  - setAirplaneMode: disabled
onFlowComplete:
  - setAirplaneMode: disabled
---
- launchApp:
    appId: org.relreader.app
    clearState: true
- startRecording: p7-pdf-text
- runFlow:
    file: common/onboarding.yaml
    env:
      PREFIX: p7
      DIGEST: skip

# 7.1 The test report and its PDF, already on the phone; "Read" opens the Text view.
- openLink: relaispdf://sample/test-sitrep
- extendedWaitUntil:
    visible:
      id: "file_row"
    timeout: 30000
- takeScreenshot: p7-01-report
- tapOn:
    text: "Read"
    childOf:
      id: "file_row"
- extendedWaitUntil:
    visible: "Text taken from the PDF on your phone.*"
    timeout: 60000
- assertVisible: "Page 1 of 3"

# 7.2 Re.L's typography, the page marker, the title, the left column's first sentence.
- assertVisible:
    id: "page_marker_1"
- assertVisible: "TEST SITUATION REPORT No. 1"
- assertVisible: ".*Water trucking reached 4,200 people in Site A.*"
- assertVisible:
    id: "mode_text"
- takeScreenshot: p7-02-text-view

# 7.3 "Table on page 2 · View in PDF" opens the PDF on page 2; the switch goes back to the text.
- scrollUntilVisible:
    element:
      id: "view_in_pdf_2"
    direction: DOWN
    timeout: 30000
- takeScreenshot: p7-03-table-link
- tapOn:
    id: "view_in_pdf_2"
- extendedWaitUntil:
    visible: "Page 2 of 3"
    timeout: 15000
- takeScreenshot: p7-04-pdf-page-2
- tapOn:
    id: "mode_text"
- extendedWaitUntil:
    visible:
      id: "page_marker_2"
    timeout: 15000

# 7.4 Search "trucking": "1 of 2", page 1 in view.
- tapOn:
    id: "pdf_search"
- inputText: "trucking"
- extendedWaitUntil:
    visible: "1 of 2"
    timeout: 10000
- assertVisible: "2 results for \"trucking\""
- hideKeyboard
- extendedWaitUntil:
    visible: ".*Water trucking reached 4,200 people in Site A.*"
    timeout: 10000
- takeScreenshot: p7-05-search-1-of-2

# 7.5 Next result: "2 of 2", page 3.
- tapOn: "Next result"
- extendedWaitUntil:
    visible: "2 of 2"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "page_marker_3"
    timeout: 10000
- takeScreenshot: p7-06-search-2-of-2
- tapOn: "Close search"

# 8.4 Copy a passage of the PDF with its citation: the citation names page 3.
- longPressOn: ".*Water trucking will continue until 30 November.*"
- extendedWaitUntil:
    visible:
      id: "selection_bar"
    timeout: 10000
- takeScreenshot: p7-07-selection-bar
- tapOn: "Copy with citation"
- extendedWaitUntil:
    notVisible:
      id: "selection_bar"
    timeout: 10000

# 7.6 Highlight in the left column of page 1 (a long press selects a word). The search
# brings the passage into view: a swipe over the text could start a selection.
- tapOn:
    id: "pdf_search"
- inputText: "trucking"
- extendedWaitUntil:
    visible: "1 of 2"
    timeout: 10000
- hideKeyboard
- tapOn: "Close search"
- extendedWaitUntil:
    visible: ".*Water trucking reached 4,200 people in Site A.*"
    timeout: 10000
- longPressOn: ".*Water trucking reached 4,200 people in Site A.*"
- extendedWaitUntil:
    visible:
      id: "selection_bar"
    timeout: 10000
- tapOn:
    id: "selection_highlight"
- extendedWaitUntil:
    visible: "Highlighted\\. Saved in Library\\."
    timeout: 10000
- takeScreenshot: p7-08-highlighted

# 7.9 Leave the reader on page 3 (reached by the search): it opens again on page 3, in
# the Text view.
- tapOn:
    id: "pdf_search"
- inputText: "trucking"
- extendedWaitUntil:
    visible: "1 of 2"
    timeout: 10000
# "Next result" closes the keyboard (theme-compose.md 10.10): no hideKeyboard here, which
# would press Back and close the search.
- tapOn: "Next result"
- extendedWaitUntil:
    visible: "2 of 2"
    timeout: 10000
- tapOn: "Close search"
# The place is saved 0.6 s after the list stops.
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible:
        id: "selection_bar"
    commands:
      - tapOn:
          id: "selection_close"
- tapOn:
    id: "pdf_close"
- scrollUntilVisible:
    element:
      id: "file_row"
    direction: UP
    timeout: 30000
    centerElement: true
- tapOn:
    text: "Read"
    childOf:
      id: "file_row"
- extendedWaitUntil:
    visible: "Page 3 of 3"
    timeout: 30000
- assertVisible:
    id: "mode_text"
- takeScreenshot: p7-09-reopened-page-3
- tapOn:
    id: "pdf_close"

# 8.4, end: paste the citation into the search field; it holds "p. 3".
- back
- tapOn:
    id: "tab_search"
- longPressOn: "Search ReliefWeb reports"
- tapOn: "Paste"
# A long press selects one word: the citation is that word, then the report and "p. 3".
- extendedWaitUntil:
    visible: "(?s).*Test Situation Report No. 1.*p\\. 3.*"
    timeout: 10000
- takeScreenshot: p7-10-pasted-citation
- hideKeyboard

# 7.7 Library > Highlights: the passage with "p. 1".
- tapOn:
    id: "tab_library"
- tapOn: "Highlights"
- extendedWaitUntil:
    visible: ".*p\\. 1.*"
    timeout: 15000
- takeScreenshot: p7-11-highlights

# 7.8 The card opens the Text view on the passage.
- tapOn: ".*Test Situation Report No. 1.*"
- extendedWaitUntil:
    visible:
      id: "mode_text"
    timeout: 30000
- assertVisible: ".*Water trucking reached 4,200 people in Site A.*"
- takeScreenshot: p7-12-opened-on-highlight
- tapOn:
    id: "pdf_close"

# 7.10 Library search finds the report by the text of its PDF, with the page; History shows
# the first lines of the PDF in place of the empty text.
- tapOn: "History"
- extendedWaitUntil:
    visible: ".*Test Situation Report No. 1 \\(test document\\).*"
    timeout: 15000
- assertVisible:
    id: "pdf_preview"
- takeScreenshot: p7-13-history-preview
# Since v0.4 the field shows from ten items in the view, or while a search is on: with fewer,
# this step is skipped (art director asked, 14/11).
- runFlow:
    when:
      visible:
        id: "library_search"
    commands:
      - tapOn: "Search your library"
      - inputText: "trucking"
      - hideKeyboard
      - extendedWaitUntil:
          visible: "Found in PDFs on your phone"
          timeout: 15000
      - scrollUntilVisible:
          element:
            id: "pdf_hit_99000005"
          direction: DOWN
          timeout: 15000
      - takeScreenshot: p7-14-library-search
      # The result opens the Text view on the passage, with the search open.
      - tapOn:
          id: "pdf_hit_99000005"
      - extendedWaitUntil:
          visible: "1 of 2"
          timeout: 30000
      - takeScreenshot: p7-14b-opened-on-result
      - tapOn: "Close search"
      - tapOn:
          id: "pdf_close"

# 7.11 A report whose PDF is a scan: the PDF view only, no switch, a short line.
- openLink: relaispdf://sample/test-scan
- extendedWaitUntil:
    visible:
      id: "file_row"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "file_row"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    text: "Read"
    childOf:
      id: "file_row"
- extendedWaitUntil:
    visible: "This PDF has no text layer. You can only read it as pages."
    timeout: 60000
- assertNotVisible:
    id: "mode_text"
- takeScreenshot: p7-15-scan
- tapOn:
    id: "pdf_close"

# 7.12 Offline, 7.2 to 7.5 again.
- setAirplaneMode: enabled
- openLink: relaispdf://sample/test-sitrep
- extendedWaitUntil:
    visible:
      id: "file_row"
    timeout: 30000
- tapOn:
    text: "Read"
    childOf:
      id: "file_row"
- extendedWaitUntil:
    visible:
      id: "mode_text"
    timeout: 30000
- tapOn:
    id: "pdf_search"
- inputText: "trucking"
- extendedWaitUntil:
    visible: "1 of 2"
    timeout: 10000
- tapOn: "Next result"
- extendedWaitUntil:
    visible: "2 of 2"
    timeout: 10000
- takeScreenshot: p7-16-offline-search

- stopRecording
