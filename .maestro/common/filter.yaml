# Taps one filter of the row on a country, crisis or Following page (theme-compose.md 12.1),
# by its test tag: filter_all, filter_sitreps, filter_analysis, filter_maps, filter_appeals,
# filter_news, filter_most_read. The row is wider than the screen: it is swiped
# left until the filter shows, then right for one left behind. Then waits for its list
# (page_<name>).
#
# Parameters (runFlow env):
#   FILTER  the end of the tag: sitreps, appeals, maps, news...
appId: org.relreader.app
---
- repeat:
    while:
      notVisible:
        id: "filter_${FILTER}"
    times: 4
    commands:
      - swipe:
          from:
            id: "filter_row"
          direction: LEFT
          duration: 500
      - waitForAnimationToEnd:
          timeout: 2000
- repeat:
    while:
      notVisible:
        id: "filter_${FILTER}"
    times: 4
    commands:
      - swipe:
          from:
            id: "filter_row"
          direction: RIGHT
          duration: 500
      - waitForAnimationToEnd:
          timeout: 2000
- tapOn:
    id: "filter_${FILTER}"
- extendedWaitUntil:
    visible:
      id: "page_${FILTER}"
    timeout: 15000
