# Journey 4, resume or review a reading (tests-parcours.md), direct mode. It uses a fixed
# report, opened by its deep link: "Sudan: Vaccine-preventable disease outbreaks in
# Darfur" (MSF, id 4237046, themes Health and Protection and Human Rights, format
# Analysis, one PDF of 25 pages).
appId: org.relreader.app
name: p4-reading
tags:
  - journey
  - direct
onFlowStart:
  - setAirplaneMode: disabled
onFlowComplete:
  - setAirplaneMode: disabled
---
- launchApp:
    appId: org.relreader.app
    clearState: true
- startRecording: p4-reading
- runFlow:
    file: common/onboarding.yaml
    env:
      PREFIX: p4
      DIGEST: skip

# 4.1 Open the MSF report, scroll, go back. Three scrolls instead of the journey's six: with
# the fling, one scroll moves most of a pixel_6 screen, and six could reach the end of the
# text (estimate, to confirm on the first run). A finished report stays out of Continue
# reading.
- openLink: relais://report/4237046
- extendedWaitUntil:
    visible:
      id: "save_button"
    timeout: 60000
- extendedWaitUntil:
    visible: ".*Vaccine-preventable disease outbreaks in Darfur.*"
    timeout: 30000
# Since v0.4 the highlighter is in the menu, once the text is loaded.
- tapOn: "More options"
- extendedWaitUntil:
    visible:
      id: "highlighter"
    timeout: 60000
- back
- takeScreenshot: p4-06-msf-report
- repeat:
    times: 3
    commands:
      - scroll
# The reading position is saved 0.7 s after the list stops.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: p4-07-msf-scrolled
- back

# 4.2 Today, Continue reading: two compact lines at most, each "title … N% read".
- extendedWaitUntil:
    visible:
      id: "tab_today"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Continue reading"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "\\d+% read"
    direction: DOWN
    timeout: 15000
- takeScreenshot: p4-08-continue-reading

# 4.3 Back where the reading stopped. The middle heading of the fixtures (step 4.3) depends
# on how far six scrolls go on this screen: not checked.
- tapOn:
    id: "doc_4237046"
# On a slow emulator the tap can last long enough to count as a long press, which opens the
# line's menu: close it and tap again.
- runFlow:
    when:
      visible: "Remove from Continue reading"
    commands:
      - back
      - tapOn:
          id: "doc_4237046"
- extendedWaitUntil:
    visible: "Picked up where you left off."
    timeout: 15000
- assertVisible: "Back to top"
- takeScreenshot: p4-09-picked-up

# 4.4 The PDF: page 3, close, open again on page 3. Since v0.4 the file is a line under the
# dates, above the text.
- scrollUntilVisible:
    element:
      id: "file_row"
    direction: UP
    timeout: 60000
    centerElement: true
- tapOn:
    text: "Read"
    childOf:
      id: "file_row"
# Only on a metered network, for files over 5 MB (this one is 11.6 MB).
- runFlow:
    when:
      visible: "This file is .*"
    commands:
      - tapOn: "Download"
- extendedWaitUntil:
    visible: "Page 1 of \\d+"
    timeout: 180000
- takeScreenshot: p4-10-pdf-page-1
- scrollUntilVisible:
    element:
      text: "Page 3 of \\d+"
    direction: DOWN
    timeout: 60000
    speed: 20
# The page is saved 0.5 s after the list stops.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: p4-11-pdf-page-3
- tapOn: "Close"
- tapOn:
    text: "Read"
    childOf:
      id: "file_row"
- extendedWaitUntil:
    visible: "Page 3 of \\d+"
    timeout: 30000
- takeScreenshot: p4-12-pdf-reopened
- tapOn: "Close"

# 4.5 Save.
- tapOn:
    id: "save_button"
- extendedWaitUntil:
    visible: "Saved to Library"
    timeout: 15000
- assertVisible: "Undo"
- assertVisible:
    text: "Saved"
    childOf:
      id: "save_button"
- takeScreenshot: p4-13-saved

# 4.6 Library, Saved.
- back
- tapOn:
    id: "tab_library"
- tapOn: "Saved"
- extendedWaitUntil:
    visible: ".*Vaccine-preventable disease outbreaks in Darfur.*"
    timeout: 15000
- assertVisible: "Saved Today · Available offline · PDF on phone"
- takeScreenshot: p4-14-library-saved

# 4.7 History (v0.4, revue-densite-v0.3.md, change 9). Its PDF is on the phone since 4.4, so
# the search field shows; the filter icon waits for ten items. The filter sheet (facets,
# Group by) is drawn by the screenshot tests.
- tapOn: "History"
- extendedWaitUntil:
    visible: ".*Vaccine-preventable disease outbreaks in Darfur.*"
    timeout: 15000
- assertVisible:
    id: "library_search"
- assertNotVisible:
    id: "library_filters"
- takeScreenshot: p4-15-history

# 4.9 Settings, Clear history: the confirmation.
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Keep history for"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Clear history"
    direction: DOWN
    timeout: 15000
- tapOn: "Clear history"
- extendedWaitUntil:
    visible: "Clear your reading history? Saved reports stay in Saved. This can't be undone."
    timeout: 15000
- takeScreenshot: p4-17-clear-history-confirm

# 4.10 Confirm (the dialog's button, below its text), then Library, History is empty.
- tapOn:
    text: "Clear history"
    below:
      text: "Clear your reading history.*"
- back
- tapOn: "History"
- extendedWaitUntil:
    visible: "Nothing here yet. Reports you open will appear here, with how far you read."
    timeout: 15000
- takeScreenshot: p4-18-history-empty

# 4.11 Saved still holds the report.
- tapOn: "Saved"
- extendedWaitUntil:
    visible: ".*Vaccine-preventable disease outbreaks in Darfur.*"
    timeout: 15000
- takeScreenshot: p4-19-saved-kept

# 4.12 Offline, after a cold start: Saved, then the report with its text. The history was
# cleared at 4.10, so the History filters of 4.7 and 4.8 are not repeated.
- setAirplaneMode: enabled
- launchApp:
    appId: org.relreader.app
- tapOn:
    id: "tab_library"
- tapOn: "Saved"
- extendedWaitUntil:
    visible: ".*Vaccine-preventable disease outbreaks in Darfur.*"
    timeout: 15000
- assertVisible: "Saved Today · Available offline · PDF on phone"
- takeScreenshot: p4-20-saved-offline
- tapOn:
    id: "doc_4237046"
- extendedWaitUntil:
    visible:
      id: "save_button"
    timeout: 15000
- assertNotVisible: "This report isn't saved on your phone. Connect to load it."
- assertVisible:
    text: "Saved"
    childOf:
      id: "save_button"
- takeScreenshot: p4-21-report-offline
- back

- stopRecording
